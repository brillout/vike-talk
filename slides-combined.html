    @page {

      margin: 0.5in;
    }
    .slide {
      page-break-after: always;
      width: 100%;
      height: 100vh;
    }
    .slide:last-child {
      page-break-after: avoid;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
